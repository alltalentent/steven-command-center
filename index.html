<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101828"><title>STEVEN | COMMAND CENTER</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#e8efff;background:#0d1422}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:230px;background:#141e30;padding:25px 15px;border-right:1px solid #283750}aside h2{font-size:16px;letter-spacing:1px;margin:0 0 35px}aside h2 span{color:#7daaff}nav button{display:block;width:100%;background:none;color:#b7c7df;border:0;text-align:left;padding:13px;border-radius:10px;margin-bottom:4px}nav button.active,nav button:hover{background:#29405f;color:white}main{margin-left:230px;padding:35px;max-width:1400px}small,.sub{color:#9eafc9}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.time{font-size:22px;color:#a8caff}h1{font-size:28px;margin:8px 0}h3{margin:0 0 16px;font-size:15px}.stats,.columns,.projects{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,1fr)}.columns{grid-template-columns:1fr 1fr;margin-top:15px}.projects{grid-template-columns:repeat(2,1fr)}.card{background:#172339;border:1px solid #30415b;border-radius:16px;padding:20px}.metric{font-size:28px;font-weight:750;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #2b3c55}.row:first-of-type{border:0}.row>div{min-width:0}.row b{display:block;overflow-wrap:anywhere}.row small{display:block;margin-top:5px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #476284;border-radius:9px;background:#2a405e;color:#e6efff;padding:8px 12px}.btn.primary{background:#5287ed;border-color:#5287ed;color:white}.btn.danger{color:#ffc0c0}.btn:hover{filter:brightness(1.18)}.bar{height:7px;background:#344258;border-radius:20px;overflow:hidden;margin:12px 0}.bar i{display:block;background:#82a8ff;height:100%}.month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border:1px solid #344764;border-radius:7px;min-height:72px;background:#1d2b42;color:#f4f7ff;text-align:left;padding:8px;overflow:hidden}.day.today{border-color:#8eb5ff}.day small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#a6c3ff}.muted{color:#97aac9}.hint{margin:18px 0;padding:14px;background:#213652;border:1px solid #34577c;border-radius:12px;color:#bed0e8;font-size:12px;line-height:1.6}.modal-bg{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#1b2941;border:1px solid #4d6484;padding:24px;border-radius:16px;width:min(490px,100%)}label{display:block;font-size:12px;color:#bccae1;margin:12px 0 5px}input:not([type=checkbox]),select{background:#101b2e;border:1px solid #465a78;border-radius:8px;padding:10px;color:white;width:100%}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:10px}.strike{text-decoration:line-through;opacity:.5}@media(max-width:850px){aside{position:static;width:auto;padding:14px}aside h2{margin:0 0 10px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{margin:0;padding:18px}.stats,.projects{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.card{padding:14px}.day{min-height:55px;padding:4px;font-size:11px}}@media(max-width:420px){.stats{gap:7px}.metric{font-size:23px}.time{font-size:16px}}
</style></head>
<body><aside><h2>STEVEN <span>/</span> COMMAND CENTER</h2><nav id="nav"><button onclick="navigate('home')">⌂ Overview</button><button onclick="navigate('tasks')">☑ Reminders</button><button onclick="navigate('calendar')">▦ Calendar</button><button onclick="navigate('projects')">▤ Projects</button><button onclick="navigate('settings')">⚙ Settings</button></nav><small>V1.4 · FIREBASE READY</small></aside><main><div class="top"><div><small id="date"></small><h1 id="heading">Overview</h1><div class="sub" id="subtitle">Your personal workspace</div><div class="sub" id="cloudStatus" style="margin-top:6px;font-size:12px">Firebase 載入中…</div></div><b class="time" id="clock"></b></div><div id="content"><section class="card"><h3>正在載入 Dashboard…</h3><p>如果畫面持續停在這裡，請重新整理頁面。</p></section></div></main><div id="overlay"></div>
<script>
window.addEventListener("error",function(e){var el=document.getElementById("cloudStatus");if(el)el.textContent="頁面載入異常："+(e.message||"未知錯誤")+"；請重新整理。";});
window.addEventListener("unhandledrejection",function(e){var el=document.getElementById("cloudStatus");if(el)el.textContent="服務連線異常："+(e.reason?.message||"請檢查網路連線");});
"use strict";
const key="steven_command_center_v1",units=["群能娛樂","台北育達高中","崇右表演藝術系","ELvina","KATCH","個人"],views=[["home","⌂ Overview"],["tasks","☑ Reminders"],["calendar","▦ Calendar"],["projects","▤ Projects"],["settings","⚙ Settings"]];
let page="home",ym=new Date(),filter="全部",data=read();
function read(){try{let v=JSON.parse(localStorage.getItem(key));if(v&&["tasks","events","projects"].every(k=>Array.isArray(v[k])))return v}catch(e){}return {tasks:[],events:[],projects:[]}}
function saveLocalOnly(){localStorage.setItem(key,JSON.stringify(data))}
function save(){saveLocalOnly();window.cloud?.write(data)}
Object.defineProperty(window,"data",{get(){return data},set(v){data=v}});
window.saveLocalOnly=saveLocalOnly;
// Functions declared in classic scripts are already exposed on window.
// Do not reassign window.render/window.navigate: that causes infinite recursion.
function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}
function safe(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function day(){return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Taipei"})}
function navigate(p){page=p;render()}
function button(label,fn,primary=false){return '<button class="btn '+(primary?"primary":"")+'" onclick="'+fn+'">'+label+'</button>'}
function label(x,y){return '<small>'+safe(x)+' · '+safe(y||"")+'</small>'}
function taskRow(t){return '<div class="row"><input type="checkbox" '+(t.done?"checked":"")+' onchange="toggleTask(\''+t.id+'\')"><div style="flex:1"><b class="'+(t.done?"strike":"")+'">'+safe(t.name)+'</b>'+label(t.unit,t.date||"無截止日期")+'</div>'+button("編輯","editItem('tasks','"+t.id+"')")+'</div>'}
function eventRow(t){return '<div class="row"><div><b>'+safe(t.name)+'</b>'+label(t.date,t.time||"全天")+'</div>'+button("編輯","editItem('events','"+t.id+"')")+'</div>'}
function projectCard(p){let a=data.tasks.filter(t=>t.project===p.id),done=a.filter(t=>t.done).length,progress=a.length?Math.round(done/a.length*100):0;return '<div class="card"><div class="toolbar"><b>'+safe(p.name)+'</b>'+button("編輯","editItem('projects','"+p.id+"')")+'</div>'+label(p.unit,p.date||"未設定期限")+'<div class="bar"><i style="width:'+progress+'%"></i></div><small>'+done+'/'+a.length+' 個任務完成 · '+progress+'%</small></div>'}
function panel(name,actions,body){return '<section class="card"><div class="toolbar"><h3>'+name+'</h3>'+actions+'</div>'+body+'</section>'}
function home(){const pending=data.tasks.filter(t=>!t.done).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")),todayEvents=data.events.filter(e=>e.date===day()).sort((a,b)=>a.time.localeCompare(b.time));return '<div class="stats"><div class="card"><small>今日行程</small><div class="metric">'+todayEvents.length+'</div><small>CALENDAR</small></div><div class="card"><small>待辦事項</small><div class="metric">'+pending.length+'</div><small>REMAINING</small></div><div class="card"><small>優先事項</small><div class="metric">'+pending.filter(t=>t.priority==="high").length+'</div><small>PRIORITY</small></div><div class="card"><small>台北天氣</small><div class="metric" id="weather">--°</div><small id="weatherText">讀取中</small></div></div><div class="columns">'+panel("TODAY'S SCHEDULE",button("＋ 新增","editItem('events')",true),todayEvents.map(eventRow).join("")||'<div class="muted">今天沒有排定行程</div>')+panel("UPCOMING TASKS",button("＋ 新增","editItem('tasks')",true),pending.slice(0,7).map(taskRow).join("")||'<div class="muted">目前沒有待辦</div>')+'</div><div style="margin-top:15px">'+panel("ACTIVE PROJECTS",button("＋ 新增","editItem('projects')",true),'<div class="projects">'+data.projects.map(projectCard).join("")+'</div>')+'</div><div class="hint">登入並成功同步後，可使用 Firebase 在不同裝置取用資料。Google Calendar、Apple 提醒事項尚未串接；目前行事曆為 Dashboard 自建資料。</div>'}
function taskPage(){let ts=data.tasks.filter(t=>filter==="全部"||t.unit===filter).sort((a,b)=>Number(a.done)-Number(b.done));return '<div class="toolbar"><select style="max-width:230px" onchange="filter=this.value;render()">'+["全部",...units].map(u=>'<option '+(u===filter?"selected":"")+'>'+u+'</option>').join("")+'</select>'+button("＋ 新增待辦","editItem('tasks')",true)+'</div>'+panel("REMINDERS","",ts.map(taskRow).join("")||'<div class="muted">沒有符合條件的待辦</div>')}
function calendarPage(){let y=ym.getFullYear(),m=ym.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,cells="";for(let i=0;i<42;i++){let d=new Date(y,m,i-first+1),s=[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");cells+='<button class="day '+(s===day()?"today":"")+'" style="'+(d.getMonth()!==m?"opacity:.4":"")+'" onclick="editItem(\'events\',null,\''+s+'\')">'+d.getDate()+data.events.filter(e=>e.date===s).slice(0,3).map(e=>'<small>• '+safe(e.name)+'</small>').join("")+'</button>'}return panel('<span id="monthTitle">'+y+' 年 '+(m+1)+' 月</span>',button("←","shift(-1)")+button("→","shift(1)")+button("＋ 新增","editItem('events')",true),'<div class="month">'+["一","二","三","四","五","六","日"].map(x=>'<small style="text-align:center">週'+x+'</small>').join("")+cells+'</div>')+'<div style="margin-top:15px">'+panel("行程清單","",data.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(eventRow).join("")||'<div class="muted">尚無行程</div>')+'</div>'}
function projectPage(){return '<div class="toolbar"><span class="muted">依工作單位管理專案</span>'+button("＋ 新增專案","editItem('projects')",true)+'</div><div class="projects">'+data.projects.map(projectCard).join("")+'</div>'}
function settingsPage(){let c=window.cloud?.config,u=window.cloud?.user;return panel("雲端登入與同步","",'<div class="row"><div><b>Firebase · steven-command-center-513b5</b><small id="cloudAccount">'+(u?safe(u.email):"尚未登入")+'</small></div>'+(c?button("更換設定","cloudSetup()") : button("設定 Firebase","cloudSetup()",true))+'</div><div class="row"><div><b>Google 登入</b><small>只同步到目前登入帳戶的私人 Firestore 路徑</small></div>'+(u?button("登出","cloudLogout()"):button("Google 登入","cloudLogin()",true))+'</div><p class="muted">首次登入會詢問你要使用雲端或本機資料。請先匯出重要資料備份。<strong>登入後若同步狀態顯示失敗，請勿假設其他裝置已收到更新。</strong></p>')+'<div style="margin-top:15px">'+panel("資料與串接狀態","",'<div class="row">Google Calendar <small>尚未授權</small></div><div class="row">Apple Reminders <small>尚未開發 Mac 同步程式</small></div><div class="row">Firebase <small>'+(window.cloud?.ready?'已連線':'尚未連接')+'</small></div><p class="muted">未登入時只保存在本機。登入並確認成功同步後，才會存入 Firestore。請定期備份。</p><div class="actions">'+button("匯出 JSON","exportData()")+button("匯入 JSON","document.getElementById('importer').click()")+button("清除資料","clearData()")+'</div><input hidden type="file" id="importer" accept=".json,application/json" onchange="importData(this.files[0])">')+'</div>'}
function render(){document.getElementById("nav").innerHTML=views.map(([k,n])=>'<button class="'+(page===k?"active":"")+'" onclick="navigate(\''+k+'\')">'+n+'</button>').join("");let meta={home:["Overview","Everything in one place"],tasks:["Reminders","工作待辦與優先順序"],calendar:["Calendar","行程與月曆"],projects:["Projects","工作專案進度"],settings:["Settings","備份與同步狀態"]}[page];document.getElementById("heading").textContent=meta[0];document.getElementById("subtitle").textContent=meta[1];try{document.getElementById("content").innerHTML=({home, tasks:taskPage,calendar:calendarPage,projects:projectPage,settings:settingsPage})[page]()}catch(e){console.error("Dashboard view rendering:",e);document.getElementById("content").innerHTML="<section class=card><h3>畫面載入失敗</h3><p>"+safe(e.message)+"</p></section>";document.getElementById("cloudStatus").textContent="畫面初始化失敗："+e.message}if(page==="home")weather()}
function shift(n){ym=new Date(ym.getFullYear(),ym.getMonth()+n,1);render()}
function toggleTask(x){let t=data.tasks.find(t=>t.id===x);if(t){t.done=!t.done;save();render()}}
function editItem(type,itemId=null,date=null){let original=data[type].find(x=>x.id===itemId)||{},fields=type==="tasks"?[["name","工作內容","text"],["unit","工作單位","unit"],["date","截止日期","date"],["priority","優先級","priority"],["project","所屬專案","project"]]:type==="events"?[["name","行程名稱","text"],["date","日期","date"],["time","時間","time"],["unit","工作單位","unit"]]:[["name","專案名稱","text"],["unit","工作單位","unit"],["date","截止日期","date"]];let inputs=fields.map(([key,text,kind])=>{let v=original[key]||(key==="unit"?units[0]:key==="priority"?"medium":key==="date"?date||"":"");let opts=kind==="unit"?units.map(x=>[x,x]):kind==="priority"?[["high","緊急"],["medium","重要"],["low","一般"]]:kind==="project"?[["","無"],...data.projects.map(p=>[p.id,p.name])]:null;return '<label>'+text+'</label>'+(opts?'<select name="'+key+'">'+opts.map(([a,b])=>'<option value="'+safe(a)+'" '+(a===v?"selected":"")+'>'+safe(b)+'</option>').join("")+'</select>':'<input name="'+key+'" type="'+kind+'" value="'+safe(v)+'" '+(key==="name"?"required":"")+'>')}).join("");document.getElementById("overlay").innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>'+(itemId?"編輯":"新增")+'</h3><form onsubmit="saveItem(event,\''+type+'\',\''+(itemId||"")+'\')">'+inputs+'<div class="toolbar" style="margin-top:20px"><div>'+(itemId?button("刪除","removeItem('"+type+"','"+itemId+"')"):"")+'</div><div class="actions">'+button("取消","closeModal()")+'<button class="btn primary">儲存</button></div></div></form></div></div>'}
function closeModal(){document.getElementById("overlay").innerHTML=""}
function saveItem(e,type,itemId){e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());obj.name=String(obj.name||"").trim();if(!obj.name)return;let old=data[type].find(x=>x.id===itemId);if(old)Object.assign(old,obj);else data[type].push({id:id(),...(type==="tasks"?{done:false}:{}),...obj});save();closeModal();render()}
function removeItem(type,itemId){if(!confirm("確定刪除？"))return;data[type]=data[type].filter(x=>x.id!==itemId);if(type==="projects")data.tasks.forEach(t=>{if(t.project===itemId)t.project=""});save();closeModal();render()}
function exportData(){let blob=new Blob([JSON.stringify({schema:key,data},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="steven-dashboard-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(f){if(!f)return;try{let j=JSON.parse(await f.text()),v=j.data;if(!v||!["tasks","events","projects"].every(k=>Array.isArray(v[k])))throw Error("格式錯誤");if(confirm("這會覆蓋目前資料，確定嗎？")){data=v;save();render()}}catch(e){alert("檔案格式不正確")}}
function clearData(){if(confirm("確定清除所有本機資料？")){data={tasks:[],events:[],projects:[]};save();render()}}
function clock(){let d=new Date();document.getElementById("clock").textContent=d.toLocaleTimeString("zh-TW",{timeZone:"Asia/Taipei",hour12:false});document.getElementById("date").textContent=d.toLocaleDateString("zh-TW",{timeZone:"Asia/Taipei",weekday:"long",year:"numeric",month:"long",day:"numeric"})}
async function weather(){try{let r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=25.033&longitude=121.5654&current=temperature_2m,weather_code&timezone=Asia%2FTaipei");let j=await r.json(),c=j.current.weather_code;let box=document.getElementById("weather"),txt=document.getElementById("weatherText");if(box)box.textContent=Math.round(j.current.temperature_2m)+"°C";if(txt)txt.textContent="台北 · "+(c===0?"晴朗":c<4?"多雲":c<70?"陰／雨":c<90?"陣雨":"雷雨")}catch(e){let el=document.getElementById("weatherText");if(el)el.textContent="天氣服務未連線"}}
try{clock();render()}catch(e){document.getElementById("cloudStatus").textContent="Dashboard 啟動失敗："+e.message;console.error(e)}
setInterval(clock,1000);setInterval(()=>{if(page==="home")weather()},900000);
</script><script type="module" src="./cloud.js?v=1.3"></script></body></html>
